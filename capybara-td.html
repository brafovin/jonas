<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Capybara Tower Defence</title>
<style>
  :root { --bg:#1d2b1f; --panel:#26382a; --panel2:#2f4634; --ink:#f4f1e4; --accent:#ffc857; --bad:#e5533d; --good:#6fcf6f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,"Segoe UI",Roboto,sans-serif; user-select:none; touch-action:manipulation; }
  #app { display:flex; gap:10px; padding:10px; height:100%; max-width:1400px; margin:0 auto; }
  #stage { position:relative; flex:1 1 auto; min-width:0; display:flex; align-items:center; justify-content:center; }
  canvas#c { width:100%; max-height:100%; aspect-ratio:960/600; background:#3e7d3a; border-radius:12px; border:3px solid #14201a; touch-action:none; cursor:crosshair; }
  #panel { flex:0 0 300px; background:var(--panel); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
  #panel > * { flex-shrink:0; }
  #hud { display:flex; justify-content:space-between; font-weight:700; font-size:17px; background:var(--panel2); border-radius:8px; padding:8px 10px; }
  #hud span b { color:var(--accent); }
  #shop { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .shopbtn { background:var(--panel2); border:2px solid transparent; border-radius:8px; color:var(--ink); padding:4px; cursor:pointer; text-align:center; font-size:12px; }
  .shopbtn canvas { width:52px; height:52px; display:block; margin:0 auto; }
  .shopbtn .n { font-weight:700; }
  .shopbtn .p { color:var(--accent); font-weight:700; }
  .shopbtn.sel { border-color:var(--accent); background:#3d5a43; }
  .shopbtn.dis { opacity:.45; }
  #info { background:var(--panel2); border-radius:8px; padding:8px; min-height:120px; font-size:13px; }
  #info h3 { margin:0 0 4px; font-size:15px; }
  #info .desc { opacity:.8; margin-bottom:6px; }
  .upg { display:block; width:100%; text-align:left; margin:4px 0; padding:6px 8px; border-radius:6px; border:0; background:#3d5a43; color:var(--ink); cursor:pointer; font-size:12px; }
  .upg b { display:block; font-size:13px; }
  .upg .c { float:right; color:var(--accent); font-weight:700; }
  .upg:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:6px; }
  button.act { flex:1; padding:8px; border:0; border-radius:8px; background:#3d5a43; color:var(--ink); font-weight:700; cursor:pointer; font-size:13px; }
  button.act.go { background:var(--good); color:#0d2010; font-size:16px; }
  button.act.sell { background:#7a3b32; }
  button.act:disabled { opacity:.5; }
  button.act.on { background:var(--accent); color:#222; }
  #overlay { position:absolute; inset:0; background:rgba(10,20,12,.86); border-radius:12px; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; z-index:5; }
  #overlay.hidden { display:none; }
  #overlay .box { max-width:520px; }
  #overlay h1 { margin:0 0 6px; font-size:34px; color:var(--accent); }
  #overlay p { margin:6px 0; line-height:1.4; }
  #overlay .diff { display:flex; gap:8px; justify-content:center; margin:14px 0; }
  #overlay .diff button { padding:10px 16px; font-size:15px; font-weight:700; border-radius:8px; border:2px solid var(--accent); background:transparent; color:var(--ink); cursor:pointer; }
  #overlay .diff button:hover { background:var(--accent); color:#222; }
  #msg { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.7); padding:6px 14px; border-radius:20px; font-size:14px; pointer-events:none; opacity:0; transition:opacity .3s; }
  #msg.show { opacity:1; }
  @media (max-width:820px) {
    #app { flex-direction:column; height:auto; min-height:100%; }
    #panel { flex:none; }
    #shop { grid-template-columns:repeat(4,1fr); }
    .shopbtn canvas { width:40px; height:40px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" width="960" height="600"></canvas>
    <div id="msg"></div>
    <div id="overlay">
      <div class="box">
        <h1>🦫 Capybara Tower Defence</h1>
        <p id="ovText">Die bösen Ballons wollen durch den Dschungel! Platziere Capybaras verschiedener Klassen, um sie zu stoppen. Überlebe <b>40 Runden</b>.</p>
        <div class="diff" id="diffBtns">
          <button data-d="0">Leicht</button>
          <button data-d="1">Normal</button>
          <button data-d="2">Schwer</button>
        </div>
        <p style="opacity:.7;font-size:13px">Leertaste = Runde starten · Esc = Abbrechen · 1–9, 0, - = Capybara wählen</p>
      </div>
    </div>
  </div>
  <aside id="panel">
    <div id="hud"><span>❤️ <b id="hLives">0</b></span><span>💰 <b id="hMoney">0</b></span><span>🌊 <b id="hRound">0</b>/40</span></div>
    <div id="shop"></div>
    <div id="info"></div>
    <div class="row">
      <button class="act go" id="bGo">▶ Runde starten</button>
    </div>
    <div class="row">
      <button class="act" id="bSpeed">Tempo ×1</button>
      <button class="act" id="bAuto">Auto: Aus</button>
      <button class="act" id="bPause">⏸</button>
    </div>
  </aside>
</div>

<script>
(() => {
'use strict';
const W = 960, H = 600;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

/* ---------- Pfad ---------- */
const PATH = [[-30,110],[200,110],[200,300],[80,300],[80,500],[340,500],[340,200],[520,200],[520,420],[700,420],[700,120],[860,120],[860,540],[990,540]];
const PATH_W = 46;
const segs = []; let TOTAL = 0;
for (let i = 0; i < PATH.length - 1; i++) {
  const [x1,y1] = PATH[i], [x2,y2] = PATH[i+1];
  const len = Math.hypot(x2-x1, y2-y1);
  segs.push({x1,y1,x2,y2,len,start:TOTAL,ang:Math.atan2(y2-y1,x2-x1)});
  TOTAL += len;
}
function posAt(d) {
  if (d < 0) d = 0;
  for (const s of segs) {
    if (d <= s.start + s.len) {
      const t = (d - s.start) / s.len;
      return {x:s.x1+(s.x2-s.x1)*t, y:s.y1+(s.y2-s.y1)*t};
    }
  }
  const s = segs[segs.length-1]; return {x:s.x2, y:s.y2};
}
function distToPath(x, y) {
  let best = 1e9;
  for (const s of segs) {
    const dx = s.x2-s.x1, dy = s.y2-s.y1;
    let t = ((x-s.x1)*dx + (y-s.y1)*dy) / (s.len*s.len);
    t = Math.max(0, Math.min(1, t));
    best = Math.min(best, Math.hypot(x-(s.x1+dx*t), y-(s.y1+dy*t)));
  }
  return best;
}

/* ---------- Hintergrund (einmal gerendert) ---------- */
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
(function drawBg() {
  const g = bg.getContext('2d');
  g.fillStyle = '#3f8a3c'; g.fillRect(0,0,W,H);
  let seed = 1234; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 700; i++) {
    g.fillStyle = rnd() < .5 ? '#48963f' : '#377a34';
    g.fillRect(rnd()*W, rnd()*H, 3+rnd()*4, 2);
  }
  // Fluss-Ufer / Pfad
  g.lineCap = 'round'; g.lineJoin = 'round';
  const stroke = (w, c) => { g.strokeStyle = c; g.lineWidth = w; g.beginPath(); PATH.forEach((p,i)=> i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.stroke(); };
  stroke(PATH_W+10, '#2c5a2a'); stroke(PATH_W+4, '#8b6a3e'); stroke(PATH_W-4, '#c9a46a');
  stroke(4, 'rgba(120,85,45,.45)');
  // Deko
  for (let i = 0; i < 90; i++) {
    const x = rnd()*W, y = rnd()*H;
    if (distToPath(x,y) < 42) continue;
    if (rnd() < .55) { // Baum
      g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(x+3,y+8,14,6,0,0,7); g.fill();
      g.fillStyle = '#6b4a2a'; g.fillRect(x-2,y-2,4,10);
      g.fillStyle = '#1f6a2e'; g.beginPath(); g.arc(x,y-8,13,0,7); g.fill();
      g.fillStyle = '#2b8a3d'; g.beginPath(); g.arc(x-3,y-11,8,0,7); g.fill();
    } else if (rnd() < .5) { // Busch/Blume
      g.fillStyle = ['#ff8fab','#ffd166','#fff'][i%3]; g.beginPath(); g.arc(x,y,3,0,7); g.fill();
    } else { g.fillStyle = '#7a7f86'; g.beginPath(); g.ellipse(x,y,7,5,0,0,7); g.fill(); }
  }
})();

/* ---------- Capybara Zeichnen ---------- */
function drawCapy(c, x, y, type, ang, sz = 1) {
  c.save(); c.translate(x, y); c.scale(sz, sz);
  if (type === 'village') { // Teich + Hütte
    c.fillStyle = '#2b7fb8'; c.beginPath(); c.ellipse(0,10,30,16,0,0,7); c.fill();
    c.strokeStyle = '#7fc8ee'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#3aa64a'; c.beginPath(); c.ellipse(-20,14,5,3,0,0,7); c.ellipse(19,6,4,2.5,0,0,7); c.fill();
    c.fillStyle = '#8a5a2e'; c.fillRect(-30,-14,14,12); c.fillStyle = '#c6402f'; c.beginPath(); c.moveTo(-33,-14); c.lineTo(-23,-24); c.lineTo(-13,-14); c.fill();
    c.translate(4,-2);
  }
  const flip = Math.cos(ang) < 0 ? -1 : 1;
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(0,14,17,5,0,0,7); c.fill();
  c.save(); c.scale(flip, 1);
  // Beine
  c.fillStyle = '#7a4f28';
  [[-11],[-5],[7],[12]].forEach(([lx]) => { c.beginPath(); c.roundRect(lx-2,5,4,9,2); c.fill(); });
  // Körper
  c.fillStyle = '#a8743f'; c.beginPath(); c.ellipse(-1,0,17,10.5,0,0,7); c.fill();
  c.fillStyle = '#c69660'; c.beginPath(); c.ellipse(-1,4,12,5,0,0,7); c.fill();
  // Kopf
  c.fillStyle = '#b98150'; c.beginPath(); c.ellipse(12,-6,9,8,0,0,7); c.fill();
  c.fillStyle = '#8a5a2e'; c.beginPath(); c.ellipse(19,-4,5.5,5.5,0,0,7); c.fill();
  c.fillStyle = '#2a170a'; c.beginPath(); c.arc(22,-6,1.2,0,7); c.fill();
  c.beginPath(); c.arc(13.5,-9,1.7,0,7); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(14,-9.5,.6,0,7); c.fill();
  c.fillStyle = '#8a5a2e'; c.beginPath(); c.arc(7,-13,3.2,0,7); c.fill();
  // Zubehör
  const hx = 10, hy = -13;
  switch (type) {
    case 'warrior':
      c.fillStyle = '#e8702a'; c.fillRect(3,-14,17,4); c.fillStyle='#c9581a'; c.beginPath(); c.moveTo(3,-13); c.lineTo(-4,-9); c.lineTo(-3,-15); c.fill(); break;
    case 'sniper':
      c.fillStyle = '#3d5a2a'; c.beginPath(); c.ellipse(hx,hy+1,9,4.5,0,Math.PI,0); c.fill(); c.fillRect(hx,hy,12,2.5);
      c.fillStyle = '#222'; c.beginPath(); c.arc(14,-9,3.4,0,7); c.fill(); c.fillStyle='#7fd'; c.beginPath(); c.arc(14,-9,1.5,0,7); c.fill(); break;
    case 'mage':
      c.fillStyle = '#6a3fb5'; c.beginPath(); c.moveTo(1,-12); c.lineTo(hx+2,-32); c.lineTo(20,-12); c.closePath(); c.fill();
      c.fillRect(-1,-13,23,3.5); c.fillStyle = '#ffd84a'; c.font='9px sans-serif'; c.fillText('★',hx-1,-18); break;
    case 'ninja':
      c.fillStyle = '#1b1b24'; c.fillRect(4,-12,17,6); c.fillStyle = '#e63946'; c.fillRect(4,-14,17,2.5);
      c.beginPath(); c.moveTo(4,-13); c.lineTo(-8,-8); c.lineTo(-6,-14); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(13.5,-9,1.5,0,7); c.fill(); break;
    case 'bomber':
      c.fillStyle = '#78808c'; c.beginPath(); c.ellipse(hx+1,hy+2,9.5,6,0,Math.PI,0); c.fill(); c.fillRect(1,-12.5,21,2.5);
      c.fillStyle = '#ffce3d'; c.fillRect(hx,-20,3,4); break;
    case 'ice':
      c.fillStyle = '#7fd3ff'; c.beginPath(); c.ellipse(hx,hy+1,9,5.5,0,Math.PI,0); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(hx,hy-6,2.6,0,7); c.fill();
      c.fillStyle = '#4fb0e8'; c.fillRect(2,-1,10,3.5); break;
    case 'hai':
      c.fillStyle = '#6c7a89'; c.beginPath(); c.ellipse(hx+1,hy+3,10,6,0,Math.PI,0); c.fill(); c.fillRect(1,-12,21,3);
      c.beginPath(); c.moveTo(4,-16); c.lineTo(9,-30); c.lineTo(15,-16); c.fill();
      c.fillStyle = '#fff'; for (let i=0;i<4;i++){ c.beginPath(); c.moveTo(16+i*2.2,-1); c.lineTo(17.1+i*2.2,3); c.lineTo(18.2+i*2.2,-1); c.fill(); } break;
    case 'boomer':
      c.fillStyle = '#7b5a2e'; c.beginPath(); c.ellipse(hx+1,hy+3,15,3.2,0,0,7); c.fill(); c.beginPath(); c.ellipse(hx+1,hy,7.5,5,0,Math.PI,0); c.fill();
      c.fillStyle = '#d9a441'; c.fillRect(hx-6,hy,15,1.6); break;
    case 'alch':
      c.fillStyle = '#4b2e6f'; c.beginPath(); c.ellipse(hx+1,hy+2,9,5,0,Math.PI,0); c.fill();
      c.fillStyle = '#7CFC00'; c.beginPath(); c.arc(13.5,-9,3.6,0,7); c.fill(); c.strokeStyle='#333'; c.lineWidth=1.2; c.stroke();
      c.fillStyle = '#2a170a'; c.beginPath(); c.arc(13.5,-9,1.7,0,7); c.fill();
      c.fillStyle = '#7CFC00'; c.beginPath(); c.roundRect(-9,-4,6,8,2); c.fill(); c.fillStyle='#fff'; c.fillRect(-8,-6,4,2); break;
    case 'village':
      c.fillStyle = '#2fa84f'; c.beginPath(); c.ellipse(hx+2,hy+3,9,3,-.3,0,7); c.fill();
      c.fillStyle = '#e63946'; c.fillRect(hx+4,hy-6,2,8); c.fillStyle = '#ffd166'; c.fillRect(hx+6,hy-6,4,3); break;
    case 'farmer':
      c.fillStyle = '#e6c25a'; c.beginPath(); c.ellipse(hx+1,hy+2,14,3.6,0,0,7); c.fill();
      c.beginPath(); c.ellipse(hx+1,hy-1,7,5,0,Math.PI,0); c.fill(); c.fillStyle='#b8452e'; c.fillRect(hx-6,hy-2,14,1.6);
      c.fillStyle = '#2fa84f'; c.font='bold 10px sans-serif'; c.fillText('$',-7,4); break;
  }
  c.restore();
  c.restore();
}
function drawWeapon(c, t) {
  const a = t.ang; c.save(); c.translate(t.x, t.y - 2); c.rotate(a);
  switch (t.type) {
    case 'sniper': c.fillStyle='#222'; c.fillRect(8,-2,26,4); c.fillStyle='#555'; c.fillRect(30,-3,6,6); break;
    case 'mage': c.strokeStyle='#8a5a2e'; c.lineWidth=3; c.beginPath(); c.moveTo(6,0); c.lineTo(26,0); c.stroke();
      c.fillStyle='#b58cff'; c.beginPath(); c.arc(28,0,5,0,7); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(27,-1,1.8,0,7); c.fill(); break;
    case 'warrior': c.strokeStyle='#5a3a1a'; c.lineWidth=2.5; c.beginPath(); c.arc(16,0,11,-1.2,1.2); c.stroke(); break;
    case 'ninja': c.fillStyle='#ccd'; c.beginPath(); for(let i=0;i<4;i++){const q=i*Math.PI/2; c.lineTo(20+Math.cos(q)*6,Math.sin(q)*6); c.lineTo(20+Math.cos(q+.78)*2.5,Math.sin(q+.78)*2.5);} c.fill(); break;
    case 'bomber': c.fillStyle='#111'; c.beginPath(); c.arc(20,0,6,0,7); c.fill(); c.fillStyle='#ff9a2a'; c.fillRect(24,-8,2,4); break;
    case 'boomer': c.strokeStyle='#d9a441'; c.lineWidth=4; c.lineCap='round'; c.beginPath(); c.moveTo(16,-8); c.lineTo(22,0); c.lineTo(16,8); c.stroke(); break;
    case 'alch': c.fillStyle='#7CFC00'; c.beginPath(); c.arc(20,0,5,0,7); c.fill(); c.fillStyle='#fff'; c.fillRect(19,-9,3,5); break;
  }
  c.restore();
}

/* ---------- Tower-Definitionen ---------- */
const TOWERS = {
  warrior: { name:'Krieger', cost:200, desc:'Wirft Pfeile mit Durchschlag. Solider Allrounder.',
    base:{range:125, rate:.75, dmg:1, pierce:2, speed:460, shots:1, spread:0, kind:'dart', col:'#f4e3b0'},
    A:{name:'Schärfe', up:[
      {n:'Spitze Pfeile', c:140, d:'+3 Durchschlag', m:s=>{s.pierce+=3}},
      {n:'Schwere Pfeile', c:320, d:'+2 Schaden', m:s=>{s.dmg+=2}},
      {n:'Pfeilhagel', c:1100, d:'5 Pfeile im Fächer, +1 Schaden', m:s=>{s.shots=5; s.spread=.55; s.dmg+=1}},
      {n:'Speerregen', c:3600, d:'7 Speere, +3 Schaden, +6 Durchschlag', m:s=>{s.shots=7; s.spread=.7; s.dmg+=3; s.pierce+=6}},
      {n:'Kriegsgott', c:15000, d:'9 Speere, +10 Schaden, schneller', m:s=>{s.shots=9; s.spread=.9; s.dmg+=10; s.rate*=.7}}]},
    B:{name:'Tempo', up:[
      {n:'Weitsicht', c:100, d:'+25 Reichweite', m:s=>{s.range+=25}},
      {n:'Schnelle Hände', c:260, d:'40% schneller', m:s=>{s.rate*=.6}},
      {n:'Dauerfeuer', c:900, d:'Extrem schnell, +15 Reichweite', m:s=>{s.rate*=.4; s.range+=15}},
      {n:'Pfeilwerfer', c:3200, d:'40% schneller, +20 Reichweite', m:s=>{s.rate*=.6; s.range+=20}},
      {n:'Pfeilsturm', c:12000, d:'Doppelt so schnell, +2 Schaden, +4 Durchschlag', m:s=>{s.rate*=.5; s.dmg+=2; s.pierce+=4}}]}},
  sniper: { name:'Scharfschütze', cost:380, desc:'Trifft überall auf der Karte. Langsam, aber stark.',
    base:{range:99999, rate:1.7, dmg:2, kind:'snipe'},
    A:{name:'Kaliber', up:[
      {n:'Panzerbrechend', c:350, d:'+3 Schaden', m:s=>{s.dmg+=3}},
      {n:'Kaliber .50', c:1000, d:'+6 Schaden', m:s=>{s.dmg+=6}},
      {n:'Vernichter', c:3200, d:'+20 Schaden', m:s=>{s.dmg+=20}},
      {n:'Railgun', c:9000, d:'+60 Schaden', m:s=>{s.dmg+=60}},
      {n:'Orbitalstrahl', c:26000, d:'+400 Schaden', m:s=>{s.dmg+=400}}]},
    B:{name:'Feuerrate', up:[
      {n:'Repetierer', c:300, d:'Schießt schneller', m:s=>{s.rate*=.65}},
      {n:'Halbautomatik', c:900, d:'Noch schneller', m:s=>{s.rate*=.7}},
      {n:'Vollautomatik', c:2600, d:'Sturmfeuer', m:s=>{s.rate*=.6}},
      {n:'Schnellfeuer', c:7000, d:'Noch viel schneller', m:s=>{s.rate*=.6}},
      {n:'Minigun', c:20000, d:'Dauerfeuer über die ganze Karte', m:s=>{s.rate*=.5}}]}},
  mage: { name:'Magier', cost:480, desc:'Magische Geschosse durchschlagen viele Ballons.',
    base:{range:130, rate:1, dmg:1, pierce:6, speed:340, shots:1, spread:0, splash:0, kind:'magic', col:'#b58cff'},
    A:{name:'Feuer', up:[
      {n:'Feuerball', c:400, d:'Explosion beim Treffer', m:s=>{s.splash=45; s.col='#ff8a3d'}},
      {n:'Inferno', c:1000, d:'Größere Explosion, +2 Schaden', m:s=>{s.splash=70; s.dmg+=2}},
      {n:'Drachenatem', c:3000, d:'+5 Schaden, riesige Explosion', m:s=>{s.dmg+=5; s.splash=100; s.rate*=.7}},
      {n:'Vulkan', c:8000, d:'+8 Schaden, gewaltige Explosion', m:s=>{s.dmg+=8; s.splash=130}},
      {n:'Phönix', c:26000, d:'+30 Schaden, Mega-Explosion, schneller', m:s=>{s.dmg+=30; s.splash=170; s.rate*=.6}}]},
    B:{name:'Arkan', up:[
      {n:'Stab-Upgrade', c:300, d:'+20 Reichweite, +6 Durchschlag', m:s=>{s.range+=20; s.pierce+=6}},
      {n:'Zwillingsblitz', c:700, d:'3 Zauber gleichzeitig', m:s=>{s.shots=3; s.spread=.3}},
      {n:'Erzmagier', c:2500, d:'5 Zauber, doppelt so schnell', m:s=>{s.shots=5; s.spread=.5; s.rate*=.5; s.dmg+=1}},

const MODES = ['Erster','Letzter','Stärkster','Nächster'];

/* ---------- Ballons ---------- */
const BCOL = ['', '#e53935','#1e88e5','#43a047','#fdd835','#ec407a','#23232b','#f2f2f2'];
const BSPD = [0, 70, 85, 100, 125, 150, 110, 110];
const BOSS_TIER = 8;

/* ---------- Spielzustand ---------- */
let S;
const DIFF = [
  {name:'Leicht', money:900, lives:200, mult:.75},
  {name:'Normal', money:700, lives:150, mult:1},
  {name:'Schwer', money:550, lives:80, mult:1.3}
];
let diffIdx = 1, nextId = 1;

function newGame(d) {
  diffIdx = d;
  S = { money:DIFF[d].money, lives:DIFF[d].lives, round:0, towers:[], enemies:[], projs:[], parts:[], fx:[],
        queue:[], qi:0, qt:0, active:false, speed:1, auto:false, paused:false, sel:null, place:null,
        over:false, won:false, mx:-99, my:-99 };
  document.getElementById('overlay').classList.add('hidden');
  refreshAll(true);
}

function makeWave(r) {
  const starts = [1,3,6,10,14,19,25]; const ev = [];
  const mult = DIFF[diffIdx].mult;
  starts.forEach((st, t) => {
    const k = r - st; if (k < 0) return;
    let n = Math.min(6 + k*3, 12 + r);
    if (t < 4) n -= Math.max(0, k-9) * 5;
    n = Math.round(n * mult);
    if (n <= 0) return;
    const gap = Math.max(.16, .75 - n*.012 - t*.04);
    const off = t * .3;
    for (let i = 0; i < n; i++) ev.push({t:off + i*gap, tier:t+1});
  });
  if (r % 10 === 0) ev.push({t:2, tier:BOSS_TIER, hp:Math.round(250 * Math.pow(r/10, 1.9) * (mult>1?1.3:mult<1?.8:1))});
  ev.sort((a,b) => a.t - b.t);
  return ev;
}

function spawn(tier, d, hp) {
  const e = {id:nextId++, d:d||0, tier, slow:0, freeze:0, dead:false, x:0, y:0};
  if (tier === BOSS_TIER) { e.hp = e.maxhp = hp || 300; }
  const p = posAt(e.d); e.x = p.x; e.y = p.y;
  S.enemies.push(e); return e;
}
const eRad = e => e.tier === BOSS_TIER ? 32 : 10 + e.tier * .9;
const eVal = e => e.tier === BOSS_TIER ? 40 : e.tier;

function pop(e, col) {
  for (let i = 0; i < 5; i++) S.parts.push({x:e.x, y:e.y, vx:(Math.random()-.5)*160, vy:(Math.random()-.5)*160, life:.35, col});
}

// Schaden an Ballon; gibt Anzahl geplatzter Schichten zurück
function hit(e, dmg) {
  if (e.dead || dmg <= 0) return 0;
  if (e.tier === BOSS_TIER) {
    e.hp -= dmg; S.money += Math.max(1, Math.round(dmg*.25));
    if (e.hp <= 0) {
      e.dead = true; pop(e,'#89a'); S.money += 100;
      for (let i = 0; i < 4; i++) spawn(6, e.d - i*14);
      flash('Boss besiegt! +$100');
    }
    return 1;
  }
  let pops = 0;
  while (dmg > 0 && !e.dead) {
    if (e.tier >= 6) { // Schwarz / Weiß platzen in zwei Rosa
      e.dead = true; pop(e, BCOL[e.tier]); pops++; S.money += 2;
      spawn(5, e.d); spawn(5, e.d - 10); break;
    }
    pop(e, BCOL[e.tier]); e.tier--; pops++; dmg--; S.money++;
    if (e.tier <= 0) e.dead = true;
  }
  return pops;
}

function poisonSplash(p) {
  S.fx.push({type:'gas', x:p.tx, y:p.ty, r:p.splash, life:.6, max:.6});
  for (const e of S.enemies) {
    if (e.dead || Math.hypot(e.x - p.tx, e.y - p.ty) > p.splash + eRad(e)) continue;
    e.poison = Math.max(e.poison || 0, p.ptime); e.pdmg = Math.max(e.pdmg || 0, p.pdmg); e.ptick = e.ptick || .5;
  }
}
function explode(x, y, r, dmg, skip) {
  S.fx.push({type:'boom', x, y, r, life:.3, max:.3});
  for (const e of S.enemies.slice()) {
    if (e.dead || e === skip || e.tier === 6) continue; // Schwarz: Explosionsimmun
    if (Math.hypot(e.x - x, e.y - y) <= r + eRad(e)) hit(e, dmg);
  }
}

/* ---------- Tower-Logik ---------- */
function computeStats(t) {
  const def = TOWERS[t.type]; const s = Object.assign({}, def.base);
  ['A','B'].forEach((p, i) => { for (let k = 0; k < t.up[i]; k++) def[p].up[k].m(s); });
  t.s = s;
}
function canPlace(x, y) {
  if (x < 18 || x > W-18 || y < 18 || y > H-18) return false;
  if (distToPath(x, y) < PATH_W/2 + 12) return false;
  for (const t of S.towers) if (Math.hypot(t.x-x, t.y-y) < 30) return false;
  return true;
}
function placeTower(type, x, y) {
  const def = TOWERS[type];
  if (S.money < def.cost || !canPlace(x, y)) return false;
  S.money -= def.cost;
  const t = {type, x, y, up:[0,0], bf:{rate:1,range:0,dmg:0}, cd:.3, ang:0, mode:0, spent:def.cost, bob:Math.random()*6};
  computeStats(t); S.towers.push(t); S.sel = t; S.place = null;
  refreshAll(true); return true;
}
function upgradeTower(t, path) {
  const def = TOWERS[t.type], key = path ? 'B' : 'A', tier = t.up[path];
  if (tier >= 5) return;
  const u = def[key].up[tier];
  if (tier >= 2 && t.up[1-path] > 2) return;
  if (S.money < u.c) return;
  S.money -= u.c; t.spent += u.c; t.up[path]++; computeStats(t); refreshAll(true);
}
function sellTower(t) {
  S.money += Math.round(t.spent * .7);
  S.towers.splice(S.towers.indexOf(t), 1); S.sel = null; refreshAll(true);
}
const rng = t => t.s.range > 5000 ? t.s.range : t.s.range + t.bf.range;
function pickTarget(t) {
  let best = null, bv = 0;
  for (const e of S.enemies) {
    if (e.dead) continue;
    const dist = Math.hypot(e.x - t.x, e.y - t.y);
    if (dist > rng(t) + eRad(e)) continue;
    let v;
    switch (t.mode) {
      case 0: v = e.d; break;
      case 1: v = -e.d; break;
      case 2: v = e.tier === BOSS_TIER ? 1000 + e.hp : e.tier * 10 + e.d/10000; break;
      default: v = -dist;
    }
    if (best === null || v > bv) { best = e; bv = v; }
  }
  return best;
}
function lead(t, e, speed) {
  let dist = Math.hypot(e.x - t.x, e.y - t.y);
  let p = {x:e.x, y:e.y};
  for (let i = 0; i < 2; i++) {
    const time = dist / speed;
    p = posAt(e.d + BSPD[Math.min(e.tier,7)] * (e.tier === BOSS_TIER ? .55 : 1) * time * (e.slow>0?.5:1));
    dist = Math.hypot(p.x - t.x, p.y - t.y);
  }
  return p;
}
function fire(t, e) {
  const s = Object.assign({}, t.s); if (s.dmg > 0) s.dmg += t.bf.dmg; s.range = rng(t);
  switch (s.kind) {
    case 'dart': case 'magic': {
      const p = lead(t, e, s.speed); const base = Math.atan2(p.y - t.y, p.x - t.x); t.ang = base;
      for (let i = 0; i < s.shots; i++) {
        const a = base + (s.shots > 1 ? (i/(s.shots-1) - .5) * s.spread * 2 : 0);
        S.projs.push({x:t.x+Math.cos(a)*14, y:t.y-2+Math.sin(a)*14, vx:Math.cos(a)*s.speed, vy:Math.sin(a)*s.speed,
          dmg:s.dmg, pierce:s.pierce, splash:s.splash||0, life:(s.range*1.5)/s.speed, hit:new Set(), col:s.col, magic:s.kind==='magic', a});
      }
      break; }
    case 'boomer': {
      const p = lead(t, e, s.speed); const base = Math.atan2(p.y - t.y, p.x - t.x); t.ang = base;
      for (let i = 0; i < s.shots; i++) {
        const a = base + (s.shots > 1 ? (i/(s.shots-1) - .5) * s.spread * 2 : 0);
        S.projs.push({boom:true, phase:0, x:t.x, y:t.y-2, ox:t.x, oy:t.y-2, vx:Math.cos(a)*s.speed, vy:Math.sin(a)*s.speed, speed:s.speed,
          maxd:s.range*1.05, trav:0, dmg:s.dmg, pierce:s.pierce, pierce0:s.pierce, splash:0, hit:new Set(), col:s.col, a:0, life:99});
      }
      break; }
    case 'bite': {
      const list = S.enemies.filter(en => !en.dead && Math.hypot(en.x-t.x, en.y-t.y) <= s.range + eRad(en)).sort((a,b) => b.d - a.d).slice(0, s.targets);
      if (list.length) t.ang = Math.atan2(list[0].y - t.y, list[0].x - t.x);
      for (const en of list) { S.fx.push({type:'bite', x:en.x, y:en.y, life:.25, max:.25}); hit(en, s.dmg); }
      break; }
    case 'potion': {
      const p = lead(t, e, s.speed); t.ang = Math.atan2(p.y - t.y, p.x - t.x);
      S.projs.push({bomb:true, potion:true, x:t.x, y:t.y-4, tx:p.x, ty:p.y, speed:s.speed, splash:s.splash, pdmg:s.pdmg, ptime:s.ptime, life:5});
      break; }
    case 'snipe':
      t.ang = Math.atan2(e.y - t.y, e.x - t.x);
      S.fx.push({type:'line', x1:t.x, y1:t.y, x2:e.x, y2:e.y, life:.12, max:.12});
      hit(e, s.dmg); break;
    case 'bomb': {
      const p = lead(t, e, s.speed); t.ang = Math.atan2(p.y - t.y, p.x - t.x);
      S.projs.push({bomb:true, x:t.x, y:t.y-4, tx:p.x, ty:p.y, speed:s.speed, dmg:s.dmg, splash:s.splash, life:5});
      break; }
    case 'pulse': {
      S.fx.push({type:'ring', x:t.x, y:t.y, r:s.range, life:.4, max:.4});
      for (const en of S.enemies) {
        if (en.dead || Math.hypot(en.x-t.x, en.y-t.y) > s.range + eRad(en)) continue;
        if (en.tier === 7) continue;
        en.slow = Math.max(en.slow, s.slow);
        if (s.freeze && en.tier !== BOSS_TIER) en.freeze = Math.max(en.freeze, s.freeze);
        if (s.dmg) hit(en, s.dmg);
      }
      break; }
  }
}

/* ---------- Update ---------- */
function update(dt) {
  if (S.over) return;
  // Spawns
  if (S.active) {
    S.qt += dt;
    while (S.qi < S.queue.length && S.queue[S.qi].t <= S.qt) {
      const q = S.queue[S.qi++]; spawn(q.tier, 0, q.hp);
    }
  }
  // Ballons
  for (const e of S.enemies) {
    if (e.dead) continue;
    if (e.poison > 0) {
      e.poison -= dt; e.ptick -= dt;
      if (e.ptick <= 0) { e.ptick += .5; hit(e, e.pdmg); if (e.dead) continue; }
      if (e.poison <= 0) e.pdmg = 0;
    }
    let sp = e.tier === BOSS_TIER ? 45 : BSPD[e.tier];
    if (e.freeze > 0) { e.freeze -= dt; sp = 0; }
    else if (e.slow > 0) { e.slow -= dt; sp *= .5; }
    e.d += sp * dt;
    if (e.d >= TOTAL) {
      e.dead = true; S.lives -= eVal(e);
      S.fx.push({type:'leak', life:.3, max:.3});
      if (S.lives <= 0) { S.lives = 0; endGame(false); }
      continue;
    }
    const p = posAt(e.d); e.x = p.x; e.y = p.y;
  }
  // Tower
  for (const t of S.towers) t.bf = {rate:1, range:0, dmg:0};
  for (const a of S.towers) if (a.s.aDist > 0) for (const t of S.towers) {
    if (t === a || Math.hypot(t.x-a.x, t.y-a.y) > a.s.aDist) continue;
    t.bf.rate = Math.max(t.bf.rate, a.s.aRate); t.bf.range = Math.max(t.bf.range, a.s.aRange); t.bf.dmg = Math.max(t.bf.dmg, a.s.aDmg);
  }
  for (const t of S.towers) {
    if (t.s.kind === 'bank' || t.s.kind === 'village') continue;
    t.cd -= dt;
    const e = pickTarget(t);
    if (e) {
      if (t.s.kind !== 'pulse') t.ang = Math.atan2(e.y - t.y, e.x - t.x);
      if (t.cd <= 0) { fire(t, e); t.cd = t.s.rate / t.bf.rate; }
    } else if (t.cd < 0) t.cd = 0;
  }
  // Projektile
  for (const p of S.projs) {
    if (p.bomb) {
      const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy), step = p.speed * dt;
      if (dist <= step) { if (p.potion) poisonSplash(p); else explode(p.tx, p.ty, p.splash, p.dmg); p.dead = true; }
      else { p.x += dx/dist*step; p.y += dy/dist*step; }
      continue;
    }
    if (p.boom) {
      p.spin = (p.spin || 0) + dt * 18;
      const step = p.speed * dt, n = Math.max(1, Math.ceil(step / 8));
      for (let i = 0; i < n && !p.dead; i++) {
        const sub = step / n;
        if (p.phase === 0) {
          p.x += p.vx / p.speed * sub; p.y += p.vy / p.speed * sub; p.trav += sub;
          if (p.trav >= p.maxd) { p.phase = 1; p.hit.clear(); p.pierce = p.pierce0; }
        } else {
          const dx = p.ox - p.x, dy = p.oy - p.y, dd = Math.hypot(dx, dy);
          if (dd < 12) { p.dead = true; break; }
          p.x += dx/dd*sub; p.y += dy/dd*sub;
        }
        for (const e of S.enemies) {
          if (e.dead || p.hit.has(e.id) || p.pierce <= 0) continue;
          if (Math.hypot(e.x - p.x, e.y - p.y) < eRad(e) + 6) { p.hit.add(e.id); hit(e, p.dmg); p.pierce--; }
        }
        if (p.pierce <= 0 && p.phase === 0) { p.phase = 1; p.hit.clear(); p.pierce = p.pierce0; }
      }
      continue;
    }
    const step = Math.hypot(p.vx, p.vy) * dt, n = Math.max(1, Math.ceil(step / 8));
    for (let i = 0; i < n && !p.dead; i++) {
      p.x += p.vx * dt / n; p.y += p.vy * dt / n;
      for (const e of S.enemies) {
        if (e.dead || p.hit.has(e.id)) continue;
        if (Math.hypot(e.x - p.x, e.y - p.y) < eRad(e) + 4) {
          p.hit.add(e.id); hit(e, p.dmg);
          if (p.splash) explode(p.x, p.y, p.splash, Math.max(1, Math.ceil(p.dmg/2)), e);
          if (--p.pierce <= 0) { p.dead = true; break; }
        }
      }
    }
    p.life -= dt; if (p.life <= 0) p.dead = true;
  }
  S.projs = S.projs.filter(p => !p.dead);
  S.enemies = S.enemies.filter(e => !e.dead);
  for (const q of S.parts) { q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt; }
  S.parts = S.parts.filter(q => q.life > 0);
  for (const f of S.fx) f.life -= dt;
  S.fx = S.fx.filter(f => f.life > 0);
  // Rundenende
  if (S.active && S.qi >= S.queue.length && S.enemies.length === 0 && !S.over) endRound();
}

function endRound() {
  S.active = false;
  let bonus = 100 + S.round * 4, extra = 0;
  for (const t of S.towers) {
    extra += t.s.income || 0;
    if (t.s.interest) extra += Math.min(Math.floor(S.money * t.s.interest), t.s.cap);
  }
  S.money += bonus + extra;
  flash(`Runde ${S.round} geschafft! +$${bonus + extra}`);
  if (S.round >= 40) { endGame(true); return; }
  refreshAll(true);
  if (S.auto) startRound();
}
function startRound() {
  if (S.active || S.over) return;
  S.round++; S.queue = makeWave(S.round); S.qi = 0; S.qt = 0; S.active = true;
  refreshAll(true);
}
function endGame(win) {
  S.over = true; S.won = win;
  const ov = document.getElementById('overlay');
  document.querySelector('#overlay h1').textContent = win ? '🏆 Gewonnen!' : '💥 Verloren';
  document.getElementById('ovText').innerHTML = win
    ? 'Alle 40 Runden überstanden – die Capybaras sind die Helden des Dschungels!'
    : `Die Ballons haben es geschafft. Du hast <b>Runde ${S.round}</b> erreicht.`;
  ov.classList.remove('hidden');
}

/* ---------- Rendering ---------- */
function drawBalloon(e) {
  const r = eRad(e);
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.tier === BOSS_TIER) {
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(4,r*.9,r,8,0,0,7); ctx.fill();
    const g = ctx.createLinearGradient(-r,0,r,0); g.addColorStop(0,'#37474f'); g.addColorStop(.5,'#90a4ae'); g.addColorStop(1,'#37474f');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0,0,r*1.25,r*.8,0,0,7); ctx.fill();
    ctx.fillStyle = '#263238'; ctx.beginPath(); ctx.moveTo(-r*1.25,0); ctx.lineTo(-r*1.6,-r*.5); ctx.lineTo(-r*1.6,r*.5); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('BOSS', 0, 5);
    ctx.fillStyle = '#300'; ctx.fillRect(-28,-r-12,56,6); ctx.fillStyle = '#e53935'; ctx.fillRect(-28,-r-12,56*Math.max(0,e.hp/e.maxhp),6);
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0,r); ctx.lineTo(1,r+9); ctx.stroke();
    ctx.fillStyle = BCOL[e.tier]; ctx.beginPath(); ctx.ellipse(0,0,r*.85,r,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2.5,r-1); ctx.lineTo(2.5,r-1); ctx.lineTo(0,r+3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(-r*.3,-r*.35,r*.2,r*.32,.5,0,7); ctx.fill();
    if (e.tier === 6 || e.tier === 7) { ctx.strokeStyle = e.tier===6?'#666':'#aaa'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(0,0,r*.85,r,0,0,7); ctx.stroke(); }
  }
  if (e.poison > 0) { ctx.strokeStyle = 'rgba(120,255,60,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0,0,r+2,0,7); ctx.stroke(); }
  if (e.freeze > 0) { ctx.fillStyle = 'rgba(160,230,255,.55)'; ctx.beginPath(); ctx.arc(0,0,r+3,0,7); ctx.fill(); }
  else if (e.slow > 0) { ctx.strokeStyle = 'rgba(120,200,255,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0,0,r+2,0,7); ctx.stroke(); }
  ctx.restore();
}

function render(time) {
  ctx.drawImage(bg, 0, 0);
  // Reichweiten
  const showRange = (x, y, r, ok) => {
    ctx.fillStyle = ok ? 'rgba(255,255,255,.14)' : 'rgba(255,60,60,.25)';
    ctx.strokeStyle = ok ? 'rgba(255,255,255,.6)' : 'rgba(255,60,60,.8)';
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.stroke();
  };
  if (S.sel && S.sel.s.range < 5000 && S.sel.s.range > 0) showRange(S.sel.x, S.sel.y, rng(S.sel), true);
  if (S.sel && S.sel.s.aDist > 0) { ctx.fillStyle='rgba(255,220,80,.12)'; ctx.strokeStyle='rgba(255,220,80,.8)'; ctx.setLineDash([6,4]); ctx.beginPath(); ctx.arc(S.sel.x,S.sel.y,S.sel.s.aDist,0,7); ctx.fill(); ctx.stroke(); ctx.setLineDash([]); }
  // Tower
  const sorted = S.towers.slice().sort((a,b)=>a.y-b.y);
  for (const t of sorted) {
    if (t === S.sel) { ctx.strokeStyle = '#ffc857'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(t.x,t.y+13,22,9,0,0,7); ctx.stroke(); }
    drawCapy(ctx, t.x, t.y, t.type, t.ang);
    drawWeapon(ctx, t);
    // Upgrade-Punkte
    for (let p = 0; p < 2; p++) for (let k = 0; k < 5; k++) {
      ctx.fillStyle = k < t.up[p] ? (p ? '#6cf' : '#fc5') : 'rgba(0,0,0,.35)';
      ctx.beginPath(); ctx.arc(t.x - 10 + k*5, t.y + 22 + p*5, 1.9, 0, 7); ctx.fill();
    }
  }
  // Ballons (hinterste zuerst)
  for (const e of S.enemies.slice().sort((a,b)=>a.d-b.d)) drawBalloon(e);
  // Projektile
  for (const p of S.projs) {
    if (p.boom) { ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.spin||0); ctx.strokeStyle = p.col; ctx.lineWidth = 4; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-8,-8); ctx.lineTo(0,0); ctx.lineTo(8,-8); ctx.stroke(); ctx.restore(); continue; }
    if (p.bomb && p.potion) { ctx.fillStyle = '#7CFC00'; ctx.beginPath(); ctx.arc(p.x,p.y,6,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.fillRect(p.x-1.5,p.y-10,3,5); continue; }
    if (p.bomb) { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(p.x,p.y,6,0,7); ctx.fill(); ctx.fillStyle='#ff9a2a'; ctx.beginPath(); ctx.arc(p.x+3,p.y-5,2,0,7); ctx.fill(); continue; }
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
    if (p.magic) { ctx.fillStyle = p.col; ctx.shadowColor = p.col; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(0,0,5.5,0,7); ctx.fill(); }
    else { ctx.fillStyle = p.col; ctx.fillRect(-6,-1.5,12,3); ctx.fillStyle='#fff'; ctx.fillRect(4,-1.5,3,3); }
    ctx.restore();
  }
  for (const q of S.parts) { ctx.globalAlpha = Math.max(0, q.life/.35); ctx.fillStyle = q.col; ctx.fillRect(q.x-2,q.y-2,4,4); }
  ctx.globalAlpha = 1;
  for (const f of S.fx) {
    const k = f.life / f.max;
    if (f.type === 'boom') { ctx.fillStyle = `rgba(255,170,60,${k*.6})`; ctx.strokeStyle = `rgba(255,230,120,${k})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(1.1-k*.3),0,7); ctx.fill(); ctx.stroke(); }
    else if (f.type === 'line') { ctx.strokeStyle = `rgba(255,255,200,${k})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(f.x1,f.y1); ctx.lineTo(f.x2,f.y2); ctx.stroke(); }
    else if (f.type === 'ring') { ctx.strokeStyle = `rgba(140,220,255,${k})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(1-k*.8),0,7); ctx.stroke(); }
    else if (f.type === 'gas') { ctx.fillStyle = `rgba(120,230,60,${k*.5})`; ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(1.15-k*.25),0,7); ctx.fill(); }
    else if (f.type === 'bite') { ctx.fillStyle = `rgba(255,255,255,${k})`; ctx.beginPath(); ctx.moveTo(f.x-10,f.y-6); ctx.lineTo(f.x-5,f.y+4); ctx.lineTo(f.x,f.y-6); ctx.lineTo(f.x+5,f.y+4); ctx.lineTo(f.x+10,f.y-6); ctx.fill(); }
    else if (f.type === 'leak') { ctx.fillStyle = `rgba(255,0,0,${k*.18})`; ctx.fillRect(0,0,W,H); }
  }
  // Platzier-Vorschau
  if (S.place) {
    const ok = canPlace(S.mx, S.my) && S.money >= TOWERS[S.place].cost;
    const r = TOWERS[S.place].base.range;
    if (r > 0 && r < 5000) showRange(S.mx, S.my, r, ok);
    else if (TOWERS[S.place].base.aDist) showRange(S.mx, S.my, TOWERS[S.place].base.aDist, ok);
    else if (r === 0) showRange(S.mx, S.my, 20, ok);
    ctx.globalAlpha = .8; drawCapy(ctx, S.mx, S.my, S.place, 0); ctx.globalAlpha = 1;
  }
  if (S.paused) { ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.font='bold 40px sans-serif'; ctx.textAlign='center'; ctx.fillText('Pause', W/2, H/2); }
}

let lastSig = '';

  for (const k of ORDER) {

  $('bPause').classList.toggle('on', S.paused);
  // Info-Panel
  const t = S.sel;
  const sig = t ? [S.towers.indexOf(t), t.up, t.mode, S.money >= 0 ? TOWERS[t.type][ 'A'].up.map((u,i)=>S.money>=u.c).join() + TOWERS[t.type]['B'].up.map(u=>S.money>=u.c).join() : ''].join('|') : (S.place ? 'p'+S.place : 'none');

    $('bSell').onclick = () => sellTower(t);
  } else if (S.place) {

  } else {

      <div style="font-size:12px;opacity:.75">Achtung: <b>Schwarze</b> Ballons sind explosionsimmun, <b>weiße</b> immun gegen Eis. Alle 10 Runden kommt ein Boss.</div>`;
  }
}

let msgT;
function flash(txt) { const m = $('msg'); m.textContent = txt; m.classList.add('show'); clearTimeout(msgT); msgT = setTimeout(()=>m.classList.remove('show'), 2200); }

/* Eingabe */
function toGame(ev) {
  const r = cv.getBoundingClientRect();
  return { x:(ev.clientX - r.left) * W / r.width, y:(ev.clientY - r.top) * H / r.height };
}
cv.addEventListener('pointermove', ev => { const p = toGame(ev); S.mx = p.x; S.my = p.y; });
cv.addEventListener('pointerdown', ev => {
  if (S.over) return;
  const p = toGame(ev); S.mx = p.x; S.my = p.y;
  if (S.place) {
    if (S.money < TOWERS[S.place].cost) { flash('Nicht genug Geld!'); return; }
    if (!canPlace(p.x, p.y)) { flash('Hier kann man nicht bauen'); return; }
    const type = S.place;
    placeTower(type, p.x, p.y);
    if (ev.shiftKey && S.money >= TOWERS[type].cost) { S.place = type; S.sel = null; refreshAll(true); }
    return;
  }
  let found = null, bd = 26;
  for (const t of S.towers) { const d = Math.hypot(t.x-p.x, t.y-p.y); if (d < bd) { bd = d; found = t; } }
  S.sel = found; refreshAll(true);
});
window.addEventListener('keydown', ev => {
  if (!S || S.over) return;
  if (ev.code === 'Space') { ev.preventDefault(); startRound(); }
  else if (ev.key === 'Escape') { S.place = null; S.sel = null; refreshAll(true); }
  else if ('1234567890-'.includes(ev.key)) { S.place = ORDER['1234567890-'.indexOf(ev.key)]; S.sel = null; refreshAll(true); }
  else if (ev.key.toLowerCase() === 'p') { S.paused = !S.paused; refreshAll(true); }
  else if ((ev.key === 'Delete' || ev.key === 'Backspace') && S.sel) sellTower(S.sel);
});
$('bGo').onclick = startRound;
$('bSpeed').onclick = () => { S.speed = S.speed % 3 + 1; refreshAll(true); };
$('bAuto').onclick = () => { S.auto = !S.auto; if (S.auto) startRound(); refreshAll(true); };
$('bPause').onclick = () => { S.paused = !S.paused; refreshAll(true); };
$('diffBtns').querySelectorAll('button').forEach(b => b.onclick = () => newGame(+b.dataset.d));

/* ---------- Hauptschleife ---------- */
S = { money:0, lives:0, round:0, towers:[], enemies:[], projs:[], parts:[], fx:[], queue:[], qi:0, qt:0, active:false, speed:1, auto:false, paused:false, sel:null, place:null, over:true, mx:-99, my:-99 };
refreshAll(true);
