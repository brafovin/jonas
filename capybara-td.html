<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Capybara Tower Defence</title>
<style>
  :root { --bg:#1d2b1f; --panel:#26382a; --panel2:#2f4634; --ink:#f4f1e4; --accent:#ffc857; --bad:#e5533d; --good:#6fcf6f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,"Segoe UI",Roboto,sans-serif; user-select:none; touch-action:manipulation; }
  #app { display:flex; gap:10px; padding:10px; height:100%; max-width:1400px; margin:0 auto; }
  #stage { position:relative; flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center; }
  canvas#c { width:960px; height:600px; background:#3e7d3a; border-radius:12px; border:3px solid #14201a; touch-action:none; cursor:crosshair; }
  #panel { flex:0 0 300px; background:var(--panel); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
  #panel > * { flex-shrink:0; }
  #hud { display:flex; justify-content:space-between; font-weight:700; font-size:17px; background:var(--panel2); border-radius:8px; padding:8px 10px; }
  #hud span b { color:var(--accent); }
  #bar { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; width:100%; background:var(--panel); border-radius:12px; padding:6px; }
  .maps { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:10px 0; }
  .mapcard { border:3px solid transparent; border-radius:8px; background:#1d2b1f; cursor:pointer; padding:4px; width:150px; font-size:12px; color:var(--ink); }
  .mapcard canvas { width:100%; border-radius:4px; display:block; }
  .herocard { width:132px; text-align:center; }
  .herocard canvas { width:56px !important; height:56px; margin:0 auto; }
  .shopbtn.hero { border-color:#ffd54a; }
  #abil:empty { display:none; }
  #abil .act { font-size:11px; padding:6px 3px; }
  .mapcard.sel { border-color:var(--accent); }
  .mapcard small { opacity:.7; display:block; }
  .shopbtn { width:71px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; background:var(--panel2); border:2px solid transparent; border-radius:8px; color:var(--ink); padding:3px; cursor:grab; text-align:center; font-size:10.5px; touch-action:none; }
  .shopbtn canvas { width:44px; height:44px; pointer-events:none; display:block; margin:0 auto; }
  .shopbtn .n { font-weight:700; }
  .shopbtn .p { color:var(--accent); font-weight:700; }
  .shopbtn.sel { border-color:var(--accent); background:#3d5a43; }
  .shopbtn.dis { opacity:.45; }
  #info { background:var(--panel2); border-radius:8px; padding:8px; min-height:120px; font-size:13px; }
  #info h3 { margin:0 0 4px; font-size:15px; }
  #info .desc { opacity:.8; margin-bottom:6px; }
  .upg { display:block; width:100%; text-align:left; margin:4px 0; padding:6px 8px; border-radius:6px; border:0; background:#3d5a43; color:var(--ink); cursor:pointer; font-size:12px; }
  .upg b { display:block; font-size:13px; }
  .upg .c { float:right; color:var(--accent); font-weight:700; }
  .upg:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:6px; }
  button.act { flex:1; padding:8px; border:0; border-radius:8px; background:#3d5a43; color:var(--ink); font-weight:700; cursor:pointer; font-size:13px; }
  button.act.go { background:var(--good); color:#0d2010; font-size:16px; }
  button.act.sell { background:#7a3b32; }
  button.act:disabled { opacity:.5; }
  button.act.on { background:var(--accent); color:#222; }
  #overlay { position:absolute; inset:0; background:rgba(10,20,12,.86); border-radius:12px; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; z-index:5; }
  #overlay.hidden { display:none; }
  #overlay .box { max-width:720px; }
  #overlay h1 { margin:0 0 6px; font-size:34px; color:var(--accent); }
  #overlay p { margin:6px 0; line-height:1.4; }
  #overlay .diff { display:flex; gap:8px; justify-content:center; margin:14px 0; }
  #overlay .diff button { padding:10px 16px; font-size:15px; font-weight:700; border-radius:8px; border:2px solid var(--accent); background:transparent; color:var(--ink); cursor:pointer; }
  #overlay .diff button:hover { background:var(--accent); color:#222; }
  #msg { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.7); padding:6px 14px; border-radius:20px; font-size:14px; pointer-events:none; opacity:0; transition:opacity .3s; }
  #msg.show { opacity:1; }
  body { background:radial-gradient(ellipse at 30% 20%, #2c4a33 0%, #16241a 70%); }
  #panel { background:linear-gradient(180deg,#2c4232,#22332a); box-shadow:0 6px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06); }
  #bar { background:linear-gradient(180deg,#2c4232,#22332a); box-shadow:0 6px 18px rgba(0,0,0,.35); }
  canvas#c { box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #hud { background:linear-gradient(180deg,#3a5a42,#2b4433); box-shadow:inset 0 1px 0 rgba(255,255,255,.1); text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .shopbtn, .upg, button.act, .mapcard { transition:transform .12s, box-shadow .12s, background .12s, border-color .12s; }
  .shopbtn { background:linear-gradient(180deg,#3a5a42,#2b4433); box-shadow:0 2px 4px rgba(0,0,0,.3); }
  .shopbtn:hover:not(.dis) { transform:translateY(-3px); box-shadow:0 6px 12px rgba(0,0,0,.4); }
  .shopbtn.sel { box-shadow:0 0 0 2px var(--accent), 0 0 14px rgba(255,200,87,.5); }
  button.act:hover:not(:disabled), .upg:hover:not(:disabled) { filter:brightness(1.18); transform:translateY(-1px); }
  button.act.go { background:linear-gradient(180deg,#8be08b,#4faf4f); box-shadow:0 3px 8px rgba(0,0,0,.35); }
  .mapcard:hover { transform:translateY(-3px); }
  #overlay { backdrop-filter:blur(3px); }
  #msg { box-shadow:0 4px 16px rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.15); }
  .para { margin:8px 0; padding:8px; border-radius:8px; background:linear-gradient(180deg,#5a4a10,#3d3308); border:1px solid #ffd54a; font-size:12px; }
  .para.on { text-align:center; font-size:13px; }
  .para .c { float:right; color:var(--accent); font-weight:700; }
  .para .req { margin:3px 0; opacity:.75; } .para .req.ok { opacity:1; color:#b9f6ca; }
  .para button { width:100%; margin-top:4px; }
  .petbox { margin:8px 0; padding:8px; border-radius:8px; background:#243a2b; font-size:12px; }
  .petbox .perk { opacity:.75; font-size:11px; display:block; margin:2px 0 4px; }
  .petrow { display:flex; gap:4px; flex-wrap:wrap; margin:4px 0; }
  .pb { width:32px; height:30px; border-radius:6px; border:2px solid transparent; background:#33503b; cursor:pointer; font-size:16px; padding:0; }
  .pb.on { border-color:var(--accent); background:#4b6d54; }
  .sw { width:20px; height:20px; border-radius:50%; border:2px solid #0006; cursor:pointer; padding:0; }
  .sw.on { border-color:#fff; box-shadow:0 0 0 2px var(--accent); }
  .petbox input { width:100%; margin-top:4px; padding:5px 8px; border-radius:6px; border:1px solid #4b6d54; background:#1a2a1f; color:var(--ink); font-size:12px; }
  #overlay { align-items:stretch; padding:14px; text-align:left; overflow:hidden; background:radial-gradient(ellipse at 50% 0%, rgba(40,80,50,.96), rgba(8,18,10,.97)); }
  #overlay .menu { position:relative; z-index:1; width:100%; max-width:900px; margin:0 auto; max-height:100%; overflow-y:auto; padding:0 8px 8px; }
  #overlay .logo { display:flex; align-items:center; gap:14px; margin:4px 0 12px; }
  #overlay .mascot { font-size:58px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.5)); animation:bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-6px) rotate(-4deg); } }
  #overlay h1 { font-size:34px; margin:0; background:linear-gradient(180deg,#ffe08a,#ffb300); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; }
  #overlay .logo p { margin:2px 0 0; opacity:.85; font-size:14px; }
  #overlay h2 { font-size:15px; margin:14px 0 6px; color:var(--accent); letter-spacing:.5px; }
  .tabs { display:flex; gap:6px; margin-bottom:6px; border-bottom:2px solid #ffffff22; }
  .tabs button { background:transparent; border:0; color:var(--ink); padding:9px 14px; font-size:15px; font-weight:700; cursor:pointer; border-radius:8px 8px 0 0; opacity:.7; }
  .tabs button.on { background:#ffffff1a; opacity:1; box-shadow:inset 0 -3px 0 var(--accent); }
  .tabs button:hover { opacity:1; }
  .tab { display:none; } .tab.on { display:block; }
  #overlay .maps { justify-content:flex-start; margin:4px 0; }
  #overlay .diff { justify-content:flex-start; flex-wrap:wrap; margin:6px 0; }
  #overlay .diff button { display:block; min-width:210px; text-align:center; line-height:1.3; }
  #overlay .diff button small { display:block; font-weight:400; font-size:11px; opacity:.85; }
  #overlay .diff button.sel { background:var(--accent); color:#222; }
  .startbar { position:sticky; bottom:0; z-index:2; box-shadow:0 -10px 14px #0f2416; background:#1d3a26 !important; }
  #panel .row .act { font-size:12px; padding:8px 4px; }
  .startbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:14px 0 4px; padding:12px; border-radius:12px; background:#ffffff12; }
  #sumLine { font-size:13px; opacity:.9; }
  #startBtn { padding:14px 30px; font-size:20px; font-weight:800; border:0; border-radius:12px; cursor:pointer; color:#0d2010; background:linear-gradient(180deg,#9df09d,#4faf4f); box-shadow:0 5px 0 #2f7a2f, 0 8px 16px rgba(0,0,0,.4); transition:transform .1s; }
  #startBtn:hover { transform:translateY(-2px); } #startBtn:active { transform:translateY(3px); box-shadow:0 2px 0 #2f7a2f; }
  .balloons { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .balloons i { position:absolute; bottom:-70px; width:26px; height:32px; border-radius:50% 50% 48% 48%; opacity:.45; animation:rise linear infinite; }
  .balloons i::after { content:''; position:absolute; left:50%; top:100%; width:1px; height:26px; background:#fff8; }
  @keyframes rise { to { transform:translateY(-1100px) translateX(40px); } }
  .petpanel { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
  .petprev { border-radius:12px; overflow:hidden; border:2px solid #ffffff22; } .petprev canvas { display:block; width:240px; height:150px; }
  .petpanel > div:last-child { flex:1; min-width:260px; }
  .wiki h3 { margin:16px 0 6px; color:var(--accent); font-size:16px; }
  .wiki p, .wiki li { font-size:13px; line-height:1.5; opacity:.92; } .wiki ul { margin:4px 0; padding-left:20px; }
  .wgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:8px; }
  .wcard { display:flex; gap:8px; background:#ffffff10; border-radius:10px; padding:6px 8px; font-size:12px; align-items:center; }
  .wcard canvas { width:46px; height:46px; flex:none; } .wcard b { display:block; font-size:13px; } .wcard span { opacity:.8; }
  .dot { display:inline-block; width:11px; height:13px; border-radius:50%; margin-right:6px; vertical-align:middle; border:1px solid #0006; }
  table.rec { border-collapse:collapse; width:100%; font-size:14px; margin:8px 0; } table.rec td, table.rec th { padding:8px 10px; border-bottom:1px solid #ffffff1a; text-align:center; } table.rec td:first-child, table.rec th:first-child { text-align:left; }
  .bigstats { display:flex; gap:12px; flex-wrap:wrap; margin:10px 0; } .bigstats div { background:#ffffff12; border-radius:12px; padding:12px 18px; text-align:center; } .bigstats b { display:block; font-size:26px; color:var(--accent); }
  #pauseMenu { position:absolute; inset:0; background:rgba(5,12,7,.72); backdrop-filter:blur(3px); z-index:6; display:flex; align-items:center; justify-content:center; border-radius:12px; }
  #pauseMenu.hidden { display:none; } .pm { background:linear-gradient(180deg,#33503b,#22332a); border-radius:16px; padding:22px 28px; min-width:280px; box-shadow:0 10px 40px #000a; display:flex; flex-direction:column; gap:10px; }
  .pm h2 { margin:0 0 6px; text-align:center; } .pm .act { flex:none; padding:12px; font-size:15px; }
  @media (max-width:820px) {
    #app { flex-direction:column; height:auto; min-height:100%; }
    #panel { flex:none; }
    canvas#c { max-height:none; }
    .shopbtn { width:calc(25% - 6px); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" width="960" height="600"></canvas>
    <div id="bar"></div>
    <div id="msg"></div>
    <div id="overlay">
      <div class="balloons" id="balloons"></div>
      <div class="menu">
        <header class="logo"><div class="mascot">🦫</div><div><h1>Capybara Tower Defence</h1><p id="ovText">Die bösen Ballons wollen durch den Dschungel! Platziere Capybaras, Helden und Flieger – überlebe <b>80 Runden</b> und darüber hinaus.</p></div></header>
        <button class="act" id="endless" style="display:none;margin:0 0 10px;flex:none;padding:10px 20px">♾ Endlos weiterspielen</button>
        <nav class="tabs" id="tabs">
          <button data-tab="play" class="on">▶ Spielen</button>
          <button data-tab="pets">🐾 Haustiere</button>
          <button data-tab="wiki">📖 Anleitung</button>
          <button data-tab="stats">🏆 Rekorde</button>
        </nav>
        <section class="tab on" id="tab-play">
          <h2>1 · Karte</h2><div class="maps" id="mapBtns"></div>
          <h2>2 · Held</h2><div class="maps" id="heroBtns"></div>
          <h2>3 · Schwierigkeit</h2>
          <div class="diff" id="diffBtns">
            <button data-d="0"><b>Leicht</b><small>200 Leben · $900 Start · 25 % weniger Ballons</small></button>
            <button data-d="1"><b>Normal</b><small>150 Leben · $700 Start · normale Wellen</small></button>
            <button data-d="2"><b>Schwer</b><small>80 Leben · $550 Start · 30 % mehr Ballons & Boss-HP</small></button>
          </div>
          <div class="startbar"><span id="sumLine"></span><button id="startBtn">▶ Spiel starten</button></div>
        </section>
        <section class="tab" id="tab-pets"></section>
        <section class="tab" id="tab-wiki"></section>
        <section class="tab" id="tab-stats"></section>
      </div>
    </div>
    <div id="pauseMenu" class="hidden"><div class="pm"><h2>⏸ Pause</h2>
      <button class="act go" id="pmResume">▶ Weiter spielen</button>
      <button class="act" id="pmRestart">🔄 Neustart (gleiche Einstellungen)</button>
      <button class="act" id="pmMenu">🏠 Hauptmenü</button></div></div>
  </div>
  <aside id="panel">
    <div id="hud"><span>❤️ <b id="hLives">0</b></span><span>💰 <b id="hMoney">0</b></span><span>🌊 <b id="hRound">0</b><span id="hMax">/80</span></span></div>
    <div class="row" id="abil"></div>
    <div id="info"></div>
    <div class="row">
      <button class="act go" id="bGo">▶ Runde starten</button>
    </div>
    <div class="row">
      <button class="act" id="bSpeed">Tempo ×1</button>
      <button class="act" id="bAuto">Auto: Aus</button>
      <button class="act" id="bPause">⏸</button>
      <button class="act" id="bMenu">☰</button>
    </div>
  </aside>
</div>

<script>
(() => {
'use strict';
const W = 960, H = 600;
const Q = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
let TIME = 0;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W * Q; cv.height = H * Q;
function fitCanvas() {
  const aw = document.getElementById('stage').clientWidth, ah = Math.max(320, window.innerHeight - (document.getElementById('bar').offsetHeight + 60));
  const w = Math.max(280, Math.min(aw, ah * W / H, 1500));
  cv.style.width = w + 'px'; cv.style.height = (w * H / W) + 'px';
}
window.addEventListener('resize', fitCanvas); setTimeout(fitCanvas, 0); requestAnimationFrame(fitCanvas);

/* ---------- Karten ---------- */
const PATH_W = 46;
const THEMES = {
  jungle: {grass:'#3f8a3c', specks:['#48963f','#377a34'], edge:'#2c5a2a', mid:'#8b6a3e', inner:'#c9a46a', line:'rgba(120,85,45,.45)'},
  desert: {grass:'#e0c27a', specks:['#e8cd8c','#cfae63'], edge:'#6d4c2a', mid:'#8a6538', inner:'#a98352', line:'rgba(60,35,15,.35)'},
  snow:   {grass:'#e6f0f6', specks:['#f8fcff','#cfe0eb'], edge:'#5f9cc4', mid:'#8cc4e6', inner:'#bfe8ff', line:'rgba(255,255,255,.55)'},
  swamp:  {grass:'#4a5d3a', specks:['#56683f','#3c4d2f'], edge:'#22221a', mid:'#4d3f2a', inner:'#71603d', line:'rgba(20,15,5,.4)'}
};
const MAPS = [
  {name:'Dschungelpfad', desc:'Klassisch, 1 Weg', theme:'jungle', lanes:[
    [[-30,110],[200,110],[200,300],[80,300],[80,500],[340,500],[340,200],[520,200],[520,420],[700,420],[700,120],[860,120],[860,540],[990,540]]]},
  {name:'Wüsten-Spirale', desc:'Lange Spirale zum Zentrum', theme:'desert', lanes:[
    [[-30,80],[900,80],[900,520],[60,520],[60,170],[800,170],[800,430],[160,430],[160,260],[700,260],[700,340],[400,340]]]},
  {name:'Eisfluss', desc:'Enge Serpentinen', theme:'snow', lanes:[
    [[-30,520],[130,520],[130,90],[300,90],[300,520],[470,520],[470,90],[640,90],[640,520],[810,520],[810,90],[990,90]]]},
  {name:'Doppelte Furt', desc:'Sumpf mit 2 Wegen', theme:'swamp', lanes:[
    [[-30,110],[250,110],[250,250],[700,250],[700,110],[990,110]],
    [[-30,500],[250,500],[250,360],[700,360],[700,500],[990,500]]]}
];
function buildLanes(map) {
  return map.lanes.map(pts => {
    const segs = []; let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const [x1,y1] = pts[i], [x2,y2] = pts[i+1];
      const len = Math.hypot(x2-x1, y2-y1);
      segs.push({x1,y1,x2,y2,len,start:total}); total += len;
    }
    return {pts, segs, total};
  });
}
function distLanes(lanes, x, y) {
  let best = 1e9;
  for (const L of lanes) for (const s of L.segs) {
    const dx = s.x2-s.x1, dy = s.y2-s.y1;
    let t = ((x-s.x1)*dx + (y-s.y1)*dy) / (s.len*s.len);
    t = Math.max(0, Math.min(1, t));
    best = Math.min(best, Math.hypot(x-(s.x1+dx*t), y-(s.y1+dy*t)));
  }
  return best;
}
function renderMapBg(map, lanes, mi) {
  const cvs = document.createElement('canvas'); cvs.width = W * Q; cvs.height = H * Q;
  const g = cvs.getContext('2d'), th = THEMES[map.theme]; g.scale(Q, Q);
  g.fillStyle = th.grass; g.fillRect(0,0,W,H);
  let seed = 1234 + mi*977; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 700; i++) { g.fillStyle = th.specks[rnd() < .5 ? 0 : 1]; g.fillRect(rnd()*W, rnd()*H, 3+rnd()*4, 2); }
  g.lineCap = 'round'; g.lineJoin = 'round';
  const stroke = (w, c) => { g.strokeStyle = c; g.lineWidth = w; lanes.forEach(L => { g.beginPath(); L.pts.forEach((p,i)=> i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.stroke(); }); };
  stroke(PATH_W+18,'rgba(0,0,0,.10)'); stroke(PATH_W+10, th.edge); stroke(PATH_W+4, th.mid); stroke(PATH_W-4, th.inner); stroke(4, th.line);
  for (let i = 0; i < 90; i++) {
    const x = rnd()*W, y = rnd()*H, r = rnd(), r2 = rnd();
    if (distLanes(lanes,x,y) < 44) continue;
    const shadow = () => { g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(x+3,y+8,14,6,0,0,7); g.fill(); };
    const rock = c => { g.fillStyle = c; g.beginPath(); g.ellipse(x,y,7,5,0,0,7); g.fill(); };
    if (map.theme === 'jungle') {
      if (r < .55) { shadow(); g.fillStyle='#6b4a2a'; g.fillRect(x-2,y-2,4,10); g.fillStyle='#1f6a2e'; g.beginPath(); g.arc(x,y-8,13,0,7); g.fill(); g.fillStyle='#2b8a3d'; g.beginPath(); g.arc(x-3,y-11,8,0,7); g.fill(); }
      else if (r2 < .5) { g.fillStyle = ['#ff8fab','#ffd166','#fff'][i%3]; g.beginPath(); g.arc(x,y,3,0,7); g.fill(); } else rock('#7a7f86');
    } else if (map.theme === 'desert') {
      if (r < .4) { shadow(); g.fillStyle='#3f8f4a'; g.beginPath(); g.roundRect(x-3,y-16,6,24,3); g.fill(); g.beginPath(); g.roundRect(x-10,y-8,5,3,1); g.roundRect(x-10,y-12,3,7,1); g.roundRect(x+5,y-6,5,3,1); g.roundRect(x+7,y-10,3,7,1); g.fill(); }

  const a = t.ang; c.save(); c.translate(t.x, t.y - 2); c.rotate(a);

    case 'mage': c.strokeStyle='#8a5a2e'; c.lineWidth=3; c.beginPath(); c.moveTo(6,0); c.lineTo(26,0); c.stroke();
      c.fillStyle='#b58cff'; c.beginPath(); c.arc(28,0,5,0,7); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(27,-1,1.8,0,7); c.fill(); break;
    case 'warrior': c.strokeStyle='#5a3a1a'; c.lineWidth=2.5; c.beginPath(); c.arc(16,0,11,-1.2,1.2); c.stroke(); break;

const BOSS_WAVES = {10:[20], 15:[22], 20:[21], 25:[22,22], 30:[21,20], 35:[22,22,22], 40:[21,21], 60:[23], 70:[23,21], 80:[23,23]};
// Bosse werden mit der Rundenzahl immer zäher
const bossScale = r => 1 + Math.pow(Math.max(0, r - 30) / 10, 4.3) * Math.pow(1 + Math.max(0, r - 60) / 10, 2);
function bossList(r) {
  if (BOSS_WAVES[r]) return BOSS_WAVES[r];
  if (r <= 40 || r % 5) return [];
  const l = []; for (let i = 0; i < Math.ceil((r-30)/20); i++) l.push(21);
  if (r % 10 === 0) for (let i = 0; i < Math.ceil((r-30)/25); i++) l.push(22);
  return l;
}
const EXTRA = [
  {tier:3, lead:true, st:8, base:3, step:2, cap:14}, {tier:5, lead:true, st:20, base:3, step:2, cap:14},
  {tier:3, camo:true, st:12, base:4, step:2, cap:16}, {tier:5, camo:true, st:24, base:4, step:2, cap:16},
  {tier:8, st:22, base:3, step:2, cap:20}, {tier:9, st:28, base:3, step:2, cap:16},
  {tier:10, st:33, base:2, step:2, cap:12}, {tier:8, camo:true, st:36, base:3, step:2, cap:12}
];
function makeWave(r) {
  const starts = [1,3,6,10,14,19,25]; const ev = [];
  const mult = DIFF[diffIdx].mult, dm = mult > 1 ? 1.3 : mult < 1 ? .8 : 1;
  starts.forEach((st, t) => {
    const k = r - st; if (k < 0) return;
    let n = Math.min(6 + k*3, 12 + r);
    if (t < 4) n -= Math.max(0, k-9) * 5;
    n = Math.round(n * mult);
    if (n <= 0) return;
    const gap = Math.max(.16, .75 - n*.012 - t*.04);
    const off = t * .3;
    for (let i = 0; i < n; i++) ev.push({t:off + i*gap, tier:t+1});
  });
  EXTRA.forEach((g, gi) => {
    const k = r - g.st; if (k < 0) return;
    const cs = 1 + Math.max(0, r-40)/40;
    const n = Math.round(Math.min(g.base + k*g.step, g.cap*cs) * mult); if (n <= 0) return;
    const gap = Math.max(.3, .95 - n*.02), off = .4 + gi*.25;
    for (let i = 0; i < n; i++) ev.push({t:off + i*gap, tier:g.tier, camo:!!g.camo, lead:!!g.lead, hp:g.tier === 10 ? Math.round(10*dm*(1 + Math.max(0, r-40)/20)) : 0});
  });
  bossList(r).forEach((bt, i) => {
    const hp = bt === 20 ? 250 * Math.pow(Math.max(r,10)/10, 1.9) : bt === 21 ? 1000 * Math.pow(r/20, 1.7) : bt === 23 ? 8000 * Math.pow(r/60, 1.8) : 150 + r*10;
    ev.push({t:2 + i*3.5, tier:bt, hp:Math.round(hp * dm * bossScale(r))});
  });
  ev.sort((a,b) => a.t - b.t);
  ev.forEach((q, i) => { q.lane = i % LANES.length; });
  return ev;
}

function spawn(tier, d, hp, lane, camo, lead) {
  const e = {id:nextId++, d:d||0, lane:lane||0, tier, slow:0, freeze:0, dead:false, x:0, y:0, camo:!!camo || !!(BOSS[tier] && BOSS[tier].camo), lead:!!lead};
  if (tier >= 20) e.spdMul = 1 + Math.max(0, S.round - 40) / 120;   // späte Bosse sind auch schneller
  if (tier >= 10) { e.hp = e.maxhp = hp || (tier === 10 ? 10 : BOSS[tier].hp); }
  const p = posAt(e.d, e.lane); e.x = p.x; e.y = p.y;
  S.enemies.push(e); return e;
}
const eRad = e => isBoss(e) ? BOSS[e.tier].r : 10 + Math.min(e.tier, 10) * .9;
const eVal = e => isBoss(e) ? BOSS[e.tier].val : BVAL[e.tier];
function spawnKids(e) {
  (KIDS[e.tier] || []).forEach((kt, i) => spawn(kt, e.d - i*12, kt >= 20 ? Math.round(BOSS[kt].hp * (S.bossScale || 1)) : 0, e.lane, e.camo));
}

function pop(e, col) {
  S.pops = (S.pops || 0) + 1;
  if (S.parts.length > 400) return;
  S.fx.push({type:'pring', x:e.x, y:e.y, col, life:.22, max:.22});
  for (let i = 0; i < 8; i++) S.parts.push({x:e.x, y:e.y, vx:(Math.random()-.5)*220, vy:(Math.random()-.7)*190, g:420, life:.5, max:.5, s:2+Math.random()*3, col});
}

// Schaden an Ballon; gibt Anzahl geplatzter Schichten zurück
function applyPoison(e, d, t) { e.poison = Math.max(e.poison || 0, t); e.pdmg = Math.max(e.pdmg || 0, d); e.ptick = e.ptick || .5; }
function jag(x1, y1, x2, y2) {
  const n = 6, pts = [{x:x1, y:y1}], dx = x2-x1, dy = y2-y1, L = Math.hypot(dx, dy) || 1;
  for (let i = 1; i < n; i++) { const o = (Math.random()-.5)*16; pts.push({x:x1+dx*i/n - dy/L*o, y:y1+dy*i/n + dx/L*o}); }
  pts.push({x:x2, y:y2}); return pts;
}
function hit(e, dmg) {
  if (e.dead || dmg <= 0) return 0;
  if (e.curse > 0 && e.curseAmt) dmg += e.curseAmt;
  if (e.lead) { e.lead = false; dmg--; pop(e, '#9aa5b1'); S.money += 1 + (S.popBonus||0); if (dmg <= 0) return 1; }
  if (e.tier >= 10) { // Keramik & Bosse: Lebenspunkte
    const boss = isBoss(e);
    e.hp -= dmg; S.money += Math.max(1, Math.round(dmg * (boss ? .25 : .5)));
    if (e.hp <= 0) {
      e.dead = true; pop(e, boss ? '#89a' : BCOL[10]);
      if (boss) { S.shake = 8; S.money += 100; heroXP(100); flash(BOSS[e.tier].name + ' besiegt! +$100'); } else S.money += 5;
      spawnKids(e);
    }
    heroXP(1);
    return 1;
  }
  let pops = 0;
  while (dmg > 0 && !e.dead) {
    if (e.tier >= 6) { // Schwarz / Weiß / Zebra / Regenbogen zerfallen in Kinder
      e.dead = true; pop(e, BCOL[e.tier] === 'rainbow' ? '#f6c' : BCOL[e.tier]); pops++; S.money += 2 + (S.popBonus||0);
      spawnKids(e); break;
    }
    pop(e, BCOL[e.tier]); e.tier--; pops++; dmg--; S.money += 1 + (S.popBonus||0);
    if (e.tier <= 0) e.dead = true;
  }
  heroXP(pops);
  return pops;
}
// Schaden eines Geschosses (spitze Waffen prallen an Blei ab)
function heroXP(n) {
  const h = S.hero; if (!h || n <= 0 || h.hero.lvl >= 20) return;
  h.hero.xp += n * (1 + S.round / 25);
  while (h.hero.lvl < 20 && h.hero.xp >= xpFor(h.hero.lvl + 1)) {
    h.hero.lvl++; computeStats(h);
    const H = HEROES[h.type], ab = H.abil.filter(a => a.lvl === h.hero.lvl)[0];
    flash(`⭐ ${H.name} erreicht Stufe ${h.hero.lvl}!` + (ab ? ` Fähigkeit: ${ab.n}` : ''), 3500);
    ringFx(h); refreshAll(true);
  }
}
function steer(p, dt) {
  let tg = p.target;

function bindPet(root, getPet, setPet) {

function toGame(ev) {
  const r = cv.getBoundingClientRect();
  return { x:(ev.clientX - r.left) * W / r.width, y:(ev.clientY - r.top) * H / r.height };
}
function tryPlace(x, y, keep) {
  const type = S.place; if (!type) return;
  if (S.money < TOWERS[type].cost) { flash('Nicht genug Geld!'); return; }
  if (!canPlace(x, y, type)) { flash('Hier kann man nicht bauen'); return; }
  placeTower(type, x, y);
  if (keep && S.money >= TOWERS[type].cost) { S.place = type; S.sel = null; refreshAll(true); }
}
cv.addEventListener('pointermove', ev => { const p = toGame(ev); S.mx = p.x; S.my = p.y; });
cv.addEventListener('pointerdown', ev => {
  if (S.over) return;
  const p = toGame(ev); S.mx = p.x; S.my = p.y;
  if (S.place) { tryPlace(p.x, p.y, ev.shiftKey); return; }
  let found = null, bd = 26;
  for (const t of S.towers) { const d = Math.hypot(t.x-p.x, t.y-p.y); if (d < bd) { bd = d; found = t; } }
  S.sel = found; refreshAll(true);
});
window.addEventListener('keydown', ev => {
  if (!S || S.over) return;
  if (ev.code === 'Space') { ev.preventDefault(); startRound(); }
  else if (ev.key === 'Escape') { if (S.place || S.sel) { S.place = null; S.sel = null; refreshAll(true); } else togglePauseMenu(); }
  else if (ev.key.length === 1 && HOTK.includes(ev.key.toLowerCase())) { S.place = ORDER[HOTK.indexOf(ev.key.toLowerCase())]; S.sel = null; refreshAll(true); }
  else if (ev.key.toLowerCase() === 'q') useAbility(0);
  else if (ev.key.toLowerCase() === 'w') useAbility(1);
  else if (ev.key.toLowerCase() === 'e') useAbility(2);
  else if (ev.key.toLowerCase() === 'h' && S.heroKey && !S.hero) { S.place = S.heroKey; S.sel = null; refreshAll(true); }
  else if (ev.key.toLowerCase() === 'p') { S.paused = !S.paused; refreshAll(true); }
  else if ((ev.key === 'Delete' || ev.key === 'Backspace') && S.sel) sellTower(S.sel);
});
